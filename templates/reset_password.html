{% extends "auth.html" %}{% block title %}Enter OTP · {{ SITE_NAME }}{% endblock %}
{% block form %}
<h2>Enter OTP</h2>
<p class="muted">We sent a code to <b>{{ email }}</b></p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<input type="hidden" name="email" value="{{ email }}">
<label>6-Digit OTP</label>
<input type="text" name="otp" placeholder="123456" maxlength="6" required autofocus>
<label>New Password <small>(at least 8 characters)</small></label>
<input type="password" name="password" minlength="8" required>
<button class="btn block">Reset Password</button>
</form>
<div class="auth-links" style="justify-content: center;">
  <a href="{{ url_for('login') }}">Cancel and return to Sign in</a>
</div>
{% endblock %}
