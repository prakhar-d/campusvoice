{% extends "auth.html" %}{% block title %}Sign in · {{ SITE_NAME }}{% endblock %}
{% block form %}
<h2>Welcome back</h2><p class="muted">Sign in to continue.</p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Email</label><input type="email" name="email" placeholder="you@example.com" required autofocus>
<label>Password</label><input type="password" name="password" placeholder="Your password" required>
<button class="btn block">Sign in</button></form>
<div class="auth-links">
  <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
  <span class="muted">New student? <a href="{{ url_for('register') }}">Create account</a></span>
</div>
{% endblock %}
