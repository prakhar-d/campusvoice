{% extends "auth.html" %}{% block title %}Forgot Password · {{ SITE_NAME }}{% endblock %}
{% block form %}
<h2>Reset Password</h2>
<p class="muted">Enter your registered email and we'll send you a 6-digit OTP.</p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Email Address</label>
<input type="email" name="email" placeholder="you@example.com" required autofocus>
<button class="btn block">Send OTP</button>
</form>
<div class="auth-links" style="justify-content: center;">
  <a href="{{ url_for('login') }}">← Back to Sign in</a>
</div>
{% endblock %}
